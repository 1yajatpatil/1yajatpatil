name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 1yajatpatil
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: speed up snake animation
        run: |
          python3 - <<'PY'
          import re, glob

          FACTOR = 0.4  # lower = faster; scales every animation duration uniformly

          for path in glob.glob("dist/*.svg"):
              with open(path) as f:
                  content = f.read()

              def scale(m):
                  return f"{max(1, int(int(m.group(1)) * FACTOR))}ms"

              content = re.sub(r"(\d+)ms", scale, content)

              with open(path, "w") as f:
                  f.write(content)
          PY

      - name: push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
