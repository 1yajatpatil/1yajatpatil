name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.md # avoid retriggering on the cache-bust commit below

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build custom growing snake
        run: node .github/workflows/build-snake.js

      - name: push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: processed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: bust README image cache
        run: |
          sed -i "s/github-contribution-grid-snake\(-dark\)\?\.svg?v=[0-9]*/github-contribution-grid-snake\1.svg?v=${{ github.run_id }}/g" README.md
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: bust snake image cache [skip ci]"
            git push
          fi
