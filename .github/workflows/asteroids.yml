name: Update Asteroids Animation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Load game state from state branch
        run: |
          git fetch origin state || true
          git show origin/state:game-state.json > game-state.json 2>/dev/null || echo '{"frame":0,"score":0,"highScore":0,"level":1,"ship":null,"asteroids":[],"bullets":[],"particles":[]}' > game-state.json
          echo "Loaded state:"
          cat game-state.json | head -5

      - name: Run game engine
        run: node scripts/game-engine.mjs

      - name: Generate SVG
        run: node scripts/svg-renderer.mjs

      - name: Save game state to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan state 2>/dev/null || git checkout state
          git reset HEAD -- .
          
          cp game-state.json ./game-state.json
          git add game-state.json
          git commit -m "frame $(node -e "console.log(require('./game-state.json').frame)")" || echo "No changes to state"
          git push origin state || git push origin HEAD:state
          
          git checkout main

      - name: Deploy SVG to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan output 2>/dev/null || git checkout output
          git reset HEAD -- .
          
          cp asteroids.svg ./asteroids.svg
          git add asteroids.svg
          git commit -m "update animation frame $(node -e "console.log(require('../game-state.json').frame)" 2>/dev/null || echo '0')" || echo "No SVG changes"
          git push origin output || git push origin HEAD:output
          
          git checkout main
